<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スズキタゴサク構文ジェネレーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div class="hero__copy">
        <p class="eyebrow">Suzuki Tagosaku Syntax</p>
        <h1>スズキタゴサク構文ジェネレーター</h1>
      </div>
      <div class="counter-card" aria-label="生成回数">
        <span class="counter-card__label">生成回数</span>
        <strong id="generateCount">0</strong>
      </div>
    </section>

    <section class="workspace" aria-label="ジェネレーター">
      <div class="generator-panel glass-panel">
        <div class="output-box" aria-live="polite">
          <p id="resultText" class="result-text">読み込んでいます...</p>
        </div>

        <div id="statusMessage" class="status-message" role="status"></div>

        <div class="button-grid">
          <button id="generateButton" class="primary-button" type="button">生成</button>
          <button id="copyButton" type="button">コピー</button>
          <button id="tweetButton" type="button">Xに投稿</button>
          <button id="favoriteButton" type="button">お気に入り</button>
          <button id="bulkButton" type="button">100件生成</button>
        </div>
      </div>

    </section>

    <section class="lists">
      <div class="glass-panel list-panel">
        <div class="panel-heading">
          <h2>履歴</h2>
          <button id="clearHistoryButton" class="small-button" type="button">履歴削除</button>
        </div>
        <ul id="historyList" class="item-list" aria-label="履歴一覧"></ul>
      </div>

      <div class="glass-panel list-panel">
        <div class="panel-heading">
          <h2>お気に入り</h2>
          <button id="clearFavoritesButton" class="small-button" type="button">全削除</button>
        </div>
        <ul id="favoriteList" class="item-list" aria-label="お気に入り一覧"></ul>
      </div>
    </section>

    <section class="glass-panel bulk-panel">
      <div class="panel-heading">
        <h2>ランダム100件</h2>
        <button id="copyBulkButton" class="small-button" type="button">まとめてコピー</button>
      </div>
      <textarea id="bulkOutput" readonly placeholder="100件生成ボタンでここに表示されます。"></textarea>
    </section>

    <div class="credits">
      Created by <strong>kaito</strong> ・
      <a href="https://www.instagram.com/kaito_yukkuri/" target="_blank" rel="noopener noreferrer">Instagram</a> ・
      <a href="https://x.com/kaito_yukuri" target="_blank" rel="noopener noreferrer">X</a>
    </div>
  </main>

  <script id="embeddedWords" type="application/json">{"templates":["{subject}は{action}。\n{reason}からです。","{subject}は今日も{action}。\n{reason}からです。","{subject}は静かに{action}。\n{reason}からです。","{subject}は問答無用で{action}。\n{reason}からです。","{subject}は一旦{action}。\n{reason}からです。","{subject}は厳重に{action}。\n{reason}からです。","{subject}は深く{action}。\n{reason}からです。","{subject}は社会的に{action}。\n{reason}からです。"],"actions":["殺します","許しません","理解できません","認めません","警戒します","観察します","封印します","記録します","審議します","保留します","監視します","通報します","隔離します","検討します","教育します","説教します","再審査します","注意します","反省させます","見守ります","問い詰めます","冷遇します","保護します","分析します"],"subjects":[{"subject":"電車に乗る人","reasons":["移動する","停車する","線路を走る","つり革を握る","ドア付近に集まる","発車メロディを聞く"]},{"subject":"カレーうどんを食べる人","reasons":["服に飛ばす","温かい","汁がある","紙エプロンを信じる","麺を跳ねさせる","白い服の日に限って注文する"]},{"subject":"月曜日に元気な人","reasons":["週の始まりを受け入れる","朝から声が大きい","予定表を開く","コーヒーを片手に笑う","土日の終わりを恐れない","始業前に挨拶が明るい"]},{"subject":"改札前で立ち止まる人","reasons":["残高を確認する","後ろに列を作る","カードを探す","進路をふさぐ","ポケットを全部確認する","改札機と会話を始める"]},{"subject":"唐揚げにレモンをかける人","reasons":["全体に均等を求める","確認を省略する","酸味を信じる","皿の主導権を握る","場の空気で柑橘を投げる","取り返しのつかない湿度を作る"]},{"subject":"会議で最後に質問する人","reasons":["終了時刻を延ばす","資料の三ページ目に戻る","全員の集中力を試す","議事録を増やす","時計を見ない","沈黙をチャンスと呼ぶ"]},{"subject":"傘を横に持つ人","reasons":["先端を揺らす","階段で存在感を出す","後方確認をしない","雨上がりに油断する","歩幅と傘幅が一致しない","街を剣道場だと思う"]},{"subject":"エレベーターの閉ボタンを連打する人","reasons":["時間を圧縮しようとする","機械に圧をかける","一秒を争う","沈黙に耐える","指先で文明を急かす","扉の気持ちを考えない"]},{"subject":"深夜にラーメンを食べる人","reasons":["背徳を選ぶ","替え玉を検討する","湯気に包まれる","明日の胃を信じる","にんにくを迷わない","丼の底に答えを探す"]},{"subject":"靴下を片方だけなくす人","reasons":["洗濯機を疑う","左右の概念を揺らす","引き出しに余白を作る","朝の判断を増やす","似た色で妥協する","片足だけ自由にする"]},{"subject":"コンビニで小銭を全部出す人","reasons":["財布の底を整理する","店員の暗算力を試す","一円玉に活躍の場を与える","後ろの列に緊張感を与える","会計を儀式にする","トレーを銀色に染める"]},{"subject":"映画館で袋菓子を開ける人","reasons":["静寂を破る","開封音で登場する","クライマックスに合わせて噛む","暗闇で塩分を探す","字幕より袋を見る","音響設備に対抗する"]},{"subject":"リモート会議でミュートを忘れる人","reasons":["生活音を共有する","キーボードを演奏する","家族の声を議事録に混ぜる","咳払いで存在を示す","沈黙にノイズを足す","会議室を家庭化する"]},{"subject":"パスワードを毎回忘れる人","reasons":["秘密を自分にも隠す","再設定メールを呼ぶ","大文字小文字に敗北する","過去の自分を信用しない","メモ帳の海を泳ぐ","ログイン画面で人生を振り返る"]},{"subject":"冷蔵庫を開けて考える人","reasons":["冷気で思考する","食材に相談する","開けた理由を忘れる","プリンの有無を確認する","庫内灯を頼る","夕飯の未来を眺める"]},{"subject":"既読をつけて寝る人","reasons":["返信を夢に預ける","相手の想像力を育てる","通知を沈黙に変える","枕元で責任を薄める","朝の自分に丸投げする","会話を一晩発酵させる"]},{"subject":"駅の階段で急に止まる人","reasons":["流れをせき止める","現在地を確認する","スマホに吸い込まれる","人波を信じすぎる","後続の反射神経を鍛える","階段を休憩所にする"]},{"subject":"焼き肉で全部ひっくり返す人","reasons":["肉の自由を奪う","網の支配者になる","焼き加減を一人で決める","トングを離さない","脂の音に興奮する","他人の皿まで見張る"]},{"subject":"飲み物を少しだけ残す人","reasons":["最後の一口を未来に送る","ペットボトルを空にしない","冷蔵庫に半端を増やす","捨てる判断を先延ばしにする","残量で存在感を残す","飲み切る責任を避ける"]},{"subject":"スクショだけ撮って読まない人","reasons":["情報を画像に封じる","カメラロールに積む","あとで読むを信じる","通知欄を保存庫にする","知識の気配だけ集める","整理を来世に任せる"]},{"subject":"アラームを五分刻みに設定する人","reasons":["朝を分割する","睡眠を小刻みに破壊する","スマホを信頼しすぎる","一回目では起きない","未来の自分と交渉する","布団との延長戦を組む"]},{"subject":"スーパーで通路の真ん中に立つ人","reasons":["棚と会議する","カートで道幅を測る","特売に心を奪われる","後方の存在を忘れる","豆腐の前で長考する","売り場を自宅化する"]},{"subject":"返信にスタンプだけ送る人","reasons":["感情を絵に任せる","文章を省略する","会話を丸く終わらせる","既読の責任を果たした気になる","便利さに溶ける","表情で議論を閉じる"]},{"subject":"カラオケでサビだけ歌う人","reasons":["Aメロを人に任せる","盛り上がりだけ回収する","マイクの渡し時を見ない","歌詞の記憶が局所的すぎる","高音で急に本気を出す","曲の構造を無視する"]},{"subject":"靴ひもを結ばず歩く人","reasons":["転倒の伏線を張る","足元にスリルを置く","結ぶ時間を惜しむ","ほどけた現実を受け入れる","歩道と勝負する","安全確認を先送りにする"]},{"subject":"信号が青になる前に歩き出す人","reasons":["未来を先取りする","横断歩道を予言する","車道に気持ちが出る","一秒を攻める","青信号を待てない","周囲をざわつかせる"]},{"subject":"電子レンジの残り一秒で止める人","reasons":["通知音に勝つ","一秒を支配する","庫内の沈黙を守る","温め完了を認めない","機械の達成感を奪う","台所で反射神経を見せる"]},{"subject":"集合写真で変顔をする人","reasons":["記録に爪痕を残す","全員の思い出を揺らす","真顔に耐えられない","アルバムの温度を上げる","後日の説明を必要にする","一枚しかない写真を賭けにする"]},{"subject":"飲食店でメニューを全部読む人","reasons":["選択肢を網羅する","おすすめを信用しない","期間限定に弱い","注文までの沈黙を伸ばす","隅の小鉢まで確認する","空腹と知性を戦わせる"]},{"subject":"布団から片足だけ出す人","reasons":["体温を微調整する","睡眠に換気を入れる","片足で外界を確認する","暑さと寒さを両立する","布団との距離感を探る","夜の温度を測る"]},{"subject":"机の上に空き缶を並べる人","reasons":["飲んだ証拠を展示する","片付けを後回しにする","アルミの城を築く","作業量を缶で表現する","捨てるタイミングを失う","机の面積を削る"]},{"subject":"エアコンの温度を一度ずつ変える人","reasons":["空気と交渉する","リモコンを頻繁に握る","体感を数字に託す","快適の境界を探す","部屋全体を実験室にする","二十六度を疑う"]},{"subject":"風呂上がりにアイスを食べる人","reasons":["体温差を楽しむ","冷凍庫に寄り道する","湯上がりをデザート化する","棒アイスの速度と戦う","幸福を溶かす","明日の分まで食べる"]},{"subject":"寝る前に動画を一本だけ見る人","reasons":["一本で終わらない","おすすめ欄に負ける","眠気を先送りにする","画面の光を浴びる","深夜を細切れにする","次の動画を運命と呼ぶ"]},{"subject":"トイレットペーパーを少しだけ残す人","reasons":["交換の責任を避ける","芯の存在を先延ばしにする","次の人に判断を渡す","残量を希望と呼ぶ","紙の終わりを認めない","生活の境界線を曖昧にする"]},{"subject":"レビューで星だけ付ける人","reasons":["言葉を残さない","評価を記号に圧縮する","理由を宇宙に預ける","店側を考え込ませる","沈黙で採点する","星座だけ作る"]},{"subject":"スマホの画面を割ったまま使う人","reasons":["指先に緊張感を持つ","ヒビを個性と呼ぶ","修理予約を先延ばしにする","保護フィルムに期待しすぎる","通知をガラス越しに読む","危うさと共存する"]},{"subject":"洗濯物を畳まず山にする人","reasons":["衣類で地形を作る","収納を延期する","着る服を発掘する","畳む工程を疑う","部屋に柔軟剤の気配を残す","山頂から靴下を探す"]},{"subject":"コーヒーを買ってすぐこぼす人","reasons":["床に香りを分ける","カップの限界を試す","ふたを信用しすぎる","歩行と液体を両立しない","朝のテンションを下げる","白いシャツに現実を描く"]},{"subject":"旅行の荷物が多すぎる人","reasons":["あらゆる可能性に備える","一泊を引っ越しにする","使わない服を連れて行く","キャリーケースを鍛える","天候を全部疑う","不安を布で包む"]},{"subject":"料理中に味見で満足する人","reasons":["完成前にピークを迎える","小皿で食事を済ませる","塩加減を何度も確認する","鍋の前で満腹になる","盛り付け前に勝利する","つまみ食いを研究と呼ぶ"]},{"subject":"本を買って積む人","reasons":["知識を高さで表す","読む未来を信じる","帯だけ先に読む","本棚に圧をかける","購入を読書の一部にする","積層された意志を眺める"]},{"subject":"チャックを開けたまま歩く人","reasons":["風通しを優先する","確認工程を省略する","社会に隙を見せる","誰かの勇気を試す","鏡を見る順番を間違える","沈黙の指摘を発生させる"]},{"subject":"イヤホンを片方だけ失くす人","reasons":["音楽を半分にする","ケースの中を空虚にする","片耳だけ未来に行く","左右の価値を学ぶ","床とカバンを疑う","モノラル生活を始める"]},{"subject":"割り勘で一円単位まで計算する人","reasons":["公平を極める","レシートを読み込む","電卓に友情を預ける","端数に魂を込める","会計後の余韻を削る","小銭の流通を促進する"]},{"subject":"天気予報を見ずに洗濯する人","reasons":["空を信用する","雲行きを勘で読む","ベランダに賭ける","雨雲レーダーを無視する","タオルを試練に出す","乾燥機との再会を呼ぶ"]},{"subject":"鍋の締めだけ本気を出す人","reasons":["雑炊に魂を込める","麺の投入時刻を見極める","スープを最後まで使う","前半を助走にする","卵の落とし方にこだわる","炭水化物で場を支配する"]},{"subject":"荷物棚にリュックを忘れる人","reasons":["上方向の存在を忘れる","電車に記念品を残す","身軽さに驚く","次の駅で青ざめる","忘れ物センターと縁を作る","網棚を信用しすぎる"]},{"subject":"会話中に急に検索する人","reasons":["記憶より検索を選ぶ","話題を画面に移す","正確さで空気を止める","曖昧さを許さない","会話を検証に変える","検索結果で戻ってくる"]},{"subject":"寝癖を帽子で隠す人","reasons":["根本解決を避ける","髪型を布で封じる","鏡との対話を省く","帽子を盾にする","湿度に敗北する","朝の混乱を携帯する"]},{"subject":"財布を忘れて堂々とする人","reasons":["キャッシュレスに賭ける","友人の優しさを試す","支払いの瞬間に気づく","ポケットの軽さを喜ぶ","現金社会に挑む","レジ前で未来を探す"]},{"subject":"道を聞かれて逆方向を教える人","reasons":["地図を雰囲気で読む","自信だけはある","東西南北を混ぜる","ランドマークを創作する","親切心が迷子になる","説明中に不安になる"]},{"subject":"名前を間違えたまま呼び続ける人","reasons":["訂正の機会を逃す","記憶を上書きしない","相手の表情を見ない","距離感を雑に縮める","呼び名に自信を持つ","会うたびに傷を深める"]},{"subject":"冷たい弁当をそのまま食べる人","reasons":["温めを諦める","米の硬さを受け入れる","電子レンジ待ちを避ける","冷気ごと昼食にする","時間を優先する","味より速度を選ぶ"]},{"subject":"スマホを顔に落とす人","reasons":["寝転び操作を過信する","重力を忘れる","鼻で通知を受ける","腕の限界を知らない","夜更かしの罰を受ける","画面との距離が近すぎる"]},{"subject":"集合時間ぴったりに家を出る人","reasons":["移動時間を無視する","ワープを前提にする","時計を楽観的に読む","謝罪文を用意しない","遅刻を予定に含める","玄関で現実を知る"]},{"subject":"机の引き出しにお菓子を隠す人","reasons":["糖分の避難所を作る","午後の自分を支援する","包装音を忍ばせる","チョコの在庫を守る","集中力を砂糖で買う","非常食を日常化する"]},{"subject":"傘を持つと雨が止む人","reasons":["天気と心理戦をする","荷物だけ増やす","備えた瞬間に晴れる","折りたたみを出番なしにする","雲に読まれる","予報への信頼を揺らす"]},{"subject":"靴を左右逆に履く人","reasons":["違和感を後で発見する","足元の概念を間違える","急ぎすぎる","玄関で判断を省く","歩き心地を疑わない","左右を哲学にする"]},{"subject":"コップを洗わず何度も使う人","reasons":["前回の味を継承する","水ですすいだ気になる","シンクに置くタイミングを失う","同じ飲み物なら平気だと思う","透明度だけで判断する","衛生観念を節約する"]},{"subject":"寝る直前に部屋を片付け始める人","reasons":["眠気を掃除に変換する","深夜に模様替えを考える","明日の自分に急に優しい","床の面積に感動する","片付けで覚醒する","睡眠時間を削って整える"]},{"subject":"レジ袋を断って手で全部持つ人","reasons":["腕力を過信する","豆腐の安定性を信じる","卵の存在を忘れる","帰り道を試練にする","袋代を守り抜く","荷物の形に負ける"]},{"subject":"メモを取った場所を忘れる人","reasons":["記録を迷子にする","紙とアプリを行き来する","未来の自分に暗号を残す","大事なことほど散らす","検索できない記憶を作る","メモの存在だけ覚える"]}]}</script>
